version: '3.9'
services:
  postgres:
    image: postgres:16
    container_name: ms_transportline_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres 
      POSTGRES_DB: MS_TransportLineDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./UrbanFlow-trips
    container_name: ms_trips_api
    depends_on:
      - postgres
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=MS_TransportLineDB;Username=postgres;Password=postgres
    ports:
      - "5001:8080"

volumes:
  postgres_data:
